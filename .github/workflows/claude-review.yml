name: Claude Code Review

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  claude-review:
    # Only run when CI was triggered by a Dependabot PR
    if: |
      github.event.workflow_run.pull_requests[0] &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read

    steps:
      - name: Get PR details
        id: get-pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.workflow_run.pull_requests[0];
            core.setOutput('pr-number', pr.number);
            const { data: prData } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });
            core.setOutput('pr-head-sha', prData.head.sha);

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.get-pr.outputs.pr-head-sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          use_sticky_comment: true
          show_full_output: true
          additional_permissions: |
            Bash(./mvnw*)
            Bash(mvn*)
            Bash(git diff*)
            Bash(git log*)
            Bash(git add*)
            Bash(git commit*)
            Bash(git push*)
            WebSearch
            WebFetch
          prompt: |
            You are an autonomous CI bot reviewing a Dependabot dependency update PR. You have FULL PERMISSION to make code changes, commit, and push to this PR branch. Do NOT ask for approval — act autonomously and fix any issues you find.

            **CI Result: ${{ github.event.workflow_run.conclusion }}**

            **CRITICAL: Trust the PR data.** The dependency version in this PR definitely exists — Dependabot only creates PRs for published releases. Do NOT claim a version doesn't exist or hasn't been released. Your training data may be outdated. Always use WebSearch to look up current release information rather than relying on your built-in knowledge about version numbers.

            **Your Tasks:**

            1. **Analyze the update:**
               - Check if this is a major, minor, or patch version bump
               - Use WebSearch to look up the changelog/release notes for the NEW version (do not guess from memory)
               - Verify compatibility with Java 17 and Spring Boot 3.1.0

            2. **Check code compatibility:**
               - Review ItemService.java and other code that uses the updated dependency
               - Look for deprecated APIs or breaking changes that affect our code

            3. **Run tests:**
               - Execute: `./mvnw clean verify --batch-mode`
               - Analyze any test failures or compilation errors

            4. **If CI failed or tests fail, you MUST fix the issues immediately. Do not ask for permission. Do not report the issue and wait. Just fix it:**
               - Identify the root cause
               - Make the necessary code changes (update imports, fix method calls, add/update dependencies, change configurations — whatever is needed)
               - Re-run `./mvnw clean verify --batch-mode` to confirm the fix works
               - Commit your changes with a clear message explaining what was fixed
               - Push the commit to this PR branch using `git push`

            5. **Report results:**
               - Provide a summary of what you found and what you did
               - If you made fixes, explain what broke and how you fixed it
               - Give a final recommendation: safe to merge, needs manual review, or blocked
               - Only mark as "blocked" if you genuinely cannot fix the issue after trying

            **You are fully authorized to modify code, commit, and push. Never ask for approval. Never say "I need your permission". Just fix it and report what you did.**
          allowed_bots: "dependabot[bot]"
          claude_args: "--max-turns 30"
