name: Claude Code Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  # First wait for CI to complete
  wait-for-ci:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI to complete
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.payload.pull_request.head.sha;
            const startTime = Date.now();
            const timeout = 10 * 60 * 1000; // 10 minutes

            core.info(`Waiting for CI check on SHA: ${sha}`);

            while (Date.now() - startTime < timeout) {
              const { data: checkRuns } = await github.rest.checks.listForRef({
                owner, repo, ref: sha,
                filter: 'latest'
              });

              const ciCheck = checkRuns.check_runs.find(cr => cr.name === 'build-and-test');

              if (ciCheck && ciCheck.status === 'completed') {
                core.info(`CI completed with conclusion: ${ciCheck.conclusion}`);
                core.setOutput('ci-conclusion', ciCheck.conclusion);
                return;
              }

              core.info('CI still running, waiting 15s...');
              await new Promise(r => setTimeout(r, 15000));
            }

            core.setFailed('Timed out waiting for CI');
        id: wait-ci

    outputs:
      ci-conclusion: ${{ steps.wait-ci.outputs.ci-conclusion }}

  # Then run Claude review with full PR context
  claude-review:
    needs: wait-for-ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Claude Code Review
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          use_sticky_comment: true
          show_full_output: true
          prompt: |
            You are an autonomous CI bot reviewing a Dependabot dependency update PR. You have FULL PERMISSION to make code changes, commit, and push to this PR branch. Do NOT ask for approval — act autonomously and fix any issues you find.

            **CI Result: ${{ needs.wait-for-ci.outputs.ci-conclusion }}**

            **CRITICAL: Trust the PR data.** The dependency version in this PR definitely exists — Dependabot only creates PRs for published releases. Do NOT claim a version doesn't exist or hasn't been released. Your training data may be outdated. Always use WebSearch to look up current release information rather than relying on your built-in knowledge about version numbers.

            **Your Tasks:**

            1. **Analyze the update:**
               - Check if this is a major, minor, or patch version bump
               - Use WebSearch to look up the changelog/release notes for the NEW version (do not guess from memory)
               - Verify compatibility with Java 17 and Spring Boot 3.1.0

            2. **Check code compatibility:**
               - Review code that uses the updated dependency
               - Look for deprecated APIs or breaking changes that affect our code

            3. **If CI failed or tests fail, you MUST fix the issues immediately. Do not ask for permission. Do not report the issue and wait. Just fix it:**
               - Identify the root cause
               - Make the necessary code changes (update imports, fix method calls, add/update dependencies, change configurations — whatever is needed)
               - Push the commit to this PR branch using `git push`

            4. **Report results:**
               - Provide a summary of what you found and what you did
               - If you made fixes, explain what broke and how you fixed it
               - **Include the final `./mvnw clean verify` output showing BUILD SUCCESS or BUILD FAILURE**
               - Give a final recommendation: safe to merge, needs manual review, or blocked
               - Only mark as "blocked" if you genuinely cannot fix the issue after trying

            **You are fully authorized to modify code, commit, and push. Never ask for approval. Never say "I need your permission". Just fix it and report what you did.**
          allowed_bots: "dependabot[bot]"
          claude_args: '--max-turns 30 --allowedTools "Edit,Write,MultiEdit,Read,Glob,Grep,LS,Bash(./mvnw:*),Bash(mvn:*),Bash(git:*),Bash(chmod:*),WebSearch,WebFetch"'

      - name: Post review comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prNumber = context.payload.pull_request.number;

            // Read Claude's output
            let report = '';
            const outputFile = '/home/runner/work/_temp/claude-execution-output.json';
            try {
              const raw = fs.readFileSync(outputFile, 'utf8');
              const data = JSON.parse(raw);
              report = data.result || 'Claude Code review completed but no summary was generated.';
            } catch (e) {
              report = 'Claude Code review completed. Check the [Actions run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.';
            }

            const timestamp = new Date().toISOString();
            const marker = '<!-- claude-code-review -->';
            const body = `${marker}\n## 🤖 Claude Code Review\n\n**Review run:** ${timestamp}\n\n${report}`;

            // Always create a new comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
            core.info('Created new review comment');

      - name: Re-trigger CI if Claude pushed fixes
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          ORIGINAL_SHA=${{ github.event.pull_request.head.sha }}
          CURRENT_SHA=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json headRefOid --jq '.headRefOid')

          if [ "$CURRENT_SHA" != "$ORIGINAL_SHA" ]; then
            BRANCH=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json headRefName --jq '.headRefName')
            echo "Claude pushed new commit ($ORIGINAL_SHA -> $CURRENT_SHA). Re-triggering CI on branch $BRANCH..."
            gh workflow run ci.yml --repo "${{ github.repository }}" --ref "$BRANCH"
            echo "CI re-triggered successfully"
          else
            echo "No new commits from Claude, skipping CI re-trigger"
          fi
