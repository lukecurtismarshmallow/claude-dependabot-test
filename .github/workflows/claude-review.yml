name: Claude Code Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  # First wait for CI to complete
  wait-for-ci:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI to complete
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.payload.pull_request.head.sha;
            const startTime = Date.now();
            const timeout = 10 * 60 * 1000; // 10 minutes

            core.info(`Waiting for CI check on SHA: ${sha}`);

            while (Date.now() - startTime < timeout) {
              const { data: checkRuns } = await github.rest.checks.listForRef({
                owner, repo, ref: sha,
                filter: 'latest'
              });

              const ciCheck = checkRuns.check_runs.find(cr => cr.name === 'build-and-test');

              if (ciCheck && ciCheck.status === 'completed') {
                core.info(`CI completed with conclusion: ${ciCheck.conclusion}`);
                core.setOutput('ci-conclusion', ciCheck.conclusion);
                return;
              }

              core.info('CI still running, waiting 15s...');
              await new Promise(r => setTimeout(r, 15000));
            }

            core.setFailed('Timed out waiting for CI');
        id: wait-ci

    outputs:
      ci-conclusion: ${{ steps.wait-ci.outputs.ci-conclusion }}

  # Then run Claude review with full PR context (only if CI failed)
  claude-review:
    needs: wait-for-ci
    if: needs.wait-for-ci.outputs.ci-conclusion == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Claude Code Review
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          use_sticky_comment: true
          show_full_output: true
          additional_permissions: |
            Bash(./mvnw*)
            Bash(mvn*)
            Bash(git*)
          prompt: |
            The CI build FAILED for this Dependabot dependency update PR. Your job is to fix it autonomously.

            **CRITICAL: Trust the PR data.** The dependency version in this PR definitely exists — Dependabot only creates PRs for published releases. Do NOT claim a version doesn't exist. If you need release info, use WebSearch.

            **Your Task:**
            1. Check recent workflow runs to view CI failure logs: `gh run list --limit 3` then `gh run view <run-id> --log`
            2. Identify the root cause from the error output
            3. Fix the code (you have WRITE permission - no approval needed)
            4. Commit: "Fix: [brief description]"
            5. Push: `git push`

            The push will automatically trigger CI to re-run. Do NOT manually re-run tests - just push and let CI handle it.

            **Be efficient:**
            - Only read files that need fixing
            - Only search docs if you need to understand a specific breaking change
            - Make surgical fixes, don't refactor unnecessarily
          allowed_bots: "dependabot[bot]"
          claude_args: '--max-turns 20 --allowedTools "Edit,Write,MultiEdit,Read,Glob,Grep,LS,Bash(./mvnw:*),Bash(mvn:*),Bash(git:*),Bash(chmod:*),WebSearch,WebFetch"'
      - name: Post review comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prNumber = context.payload.pull_request.number;

            // Read Claude's output
            let report = '';
            const outputFile = '/home/runner/work/_temp/claude-execution-output.json';
            try {
              const raw = fs.readFileSync(outputFile, 'utf8');
              const data = JSON.parse(raw);
              report = data.result || 'Claude Code review completed but no summary was generated.';
            } catch (e) {
              report = 'Claude Code review completed. Check the [Actions run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.';
            }

            const timestamp = new Date().toISOString();
            const marker = '<!-- claude-code-review -->';
            const body = `${marker}\n## 🤖 Claude Code Review\n\n**Review run:** ${timestamp}\n\n${report}`;

            // Always create a new comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
            core.info('Created new review comment');

      - name: Re-trigger CI if Claude pushed fixes
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          ORIGINAL_SHA=${{ github.event.pull_request.head.sha }}
          CURRENT_SHA=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json headRefOid --jq '.headRefOid')

          if [ "$CURRENT_SHA" != "$ORIGINAL_SHA" ]; then
            BRANCH=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json headRefName --jq '.headRefName')
            echo "Claude pushed new commit ($ORIGINAL_SHA -> $CURRENT_SHA). Re-triggering CI on branch $BRANCH..."
            gh workflow run ci.yml --repo "${{ github.repository }}" --ref "$BRANCH"
            echo "CI re-triggered successfully"
          else
            echo "No new commits from Claude, skipping CI re-trigger"
          fi
